spring:
  application:
    name: next-gen-rule-engine

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # DataSource (H2 for dev, PostgreSQL for prod)
  datasource:
    url: jdbc:h2:mem:ruleengine
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: rule-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=1h

# Server Configuration
server:
  port: 8080
  compression:
    enabled: true

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Rule Engine Configuration
rule-engine:
  # Execution Settings
  execution:
    thread-pool-size: 20
    max-rule-execution-time-ms: 1000
    enable-parallel-execution: true

  # Cache Settings
  cache:
    hot-rules-size: 1000
    fact-cache-size: 5000
    ttl-minutes: 60

  # Optimization Settings
  optimization:
    enable-jit-compilation: true
    jit-threshold: 100
    enable-rule-indexing: true

  # Monitoring
  monitoring:
    enable-audit-log: true
    enable-metrics: true
    trace-execution: true
